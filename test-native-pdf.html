<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PDF標準表示テスト</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#161616;color:white}header{padding:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,input{font-size:16px}button{padding:8px}#pdf{display:block;width:100%;height:calc(100dvh - 130px);border:0;background:#444}#msg{padding:0 12px 8px;font-size:13px;color:#ddd}a{color:#9dd8ff}</style></head><body><header><strong>ブラウザ標準PDF表示テスト</strong><input id="file" type="file" accept="application/pdf,.pdf"><button id="open" disabled>PDFを別タブで開く</button></header><div id="msg">元のIllustrator製PDFを選択してください。文字が表示されるか確認します。</div><iframe id="pdf" title="PDFのプレビュー"></iframe><script>let url=null;const input=document.getElementById('file'),frame=document.getElementById('pdf'),msg=document.getElementById('msg'),open=document.getElementById('open');input.addEventListener('change',()=>{const f=input.files&&input.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);frame.src=url+'#toolbar=1&navpanes=0';open.disabled=false;msg.textContent='選択中: '+f.name+'。下に表示されない場合は「PDFを別タブで開く」を試してください。';});open.addEventListener('click',()=>{if(url)window.open(url,'_blank','noopener');});</script></body></html>
