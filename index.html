<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <title>PDF Slide Viewer</title>
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
    #viewer { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; touch-action:manipulation; }
    canvas { max-width:100%; max-height:100%; display:block; object-fit:contain; }
    #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; background:#111; text-align:center; z-index:2; }
    #start h1 { font-size:24px; margin:0; }
    #start p { color:#bbb; margin:0; font-size:14px; line-height:1.6; }
    button { background:#fff; color:#111; border:0; border-radius:12px; padding:14px 24px; font-size:17px; font-weight:600; }
    #file { display:none; }
    #status { position:fixed; bottom:calc(12px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); padding:7px 12px; border-radius:12px; background:#222c; font-size:12px; pointer-events:none; opacity:0; transition:opacity .2s; z-index:3; }
    #error { color:#ffb7b7; max-width:450px; }
  </style>
</head>
<body>
  <div id="viewer" aria-label="左側タップで前のページ、右側タップで次のページ"><canvas id="page"></canvas></div>
  <div id="start"><h1>PDF Slide Viewer</h1><p>PDFを選ぶとスライド表示を開始します。<br>左タップ：前へ ／ 右タップ：次へ<br>長押しでファイル選択画面に戻れます。</p><button id="open">PDFを選択</button><input id="file" type="file" accept="application/pdf,.pdf"><p id="error" role="alert"></p></div>
  <div id="status" role="status"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    (() => {
      const start = document.getElementById('start'), input = document.getElementById('file');
      const canvas = document.getElementById('page'), ctx = canvas.getContext('2d');
      const status = document.getElementById('status'), error = document.getElementById('error');
      let pdf = null, current = 1, rendering = false, pending = null, holdTimer = null, holdFired = false;
      let statusTimer;
      const flash = (msg) => { status.textContent=msg; status.style.opacity='1'; clearTimeout(statusTimer); statusTimer=setTimeout(()=>status.style.opacity='0',1100); };
      document.getElementById('open').addEventListener('click', () => input.click());
      async function render(number) {
        if (!pdf) return;
        number = Math.max(1, Math.min(pdf.numPages, number));
        if (rendering) { pending = number; return; }
        rendering = true;
        try {
          const page = await pdf.getPage(number);
          const viewport = page.getViewport({scale:1});
          const scale = Math.min(innerWidth/viewport.width, innerHeight/viewport.height);
          const dpr = Math.min(devicePixelRatio || 1, 2);
          const scaled = page.getViewport({scale:scale*dpr});
          canvas.width = Math.round(scaled.width); canvas.height = Math.round(scaled.height);
          canvas.style.width = `${scaled.width/dpr}px`; canvas.style.height = `${scaled.height/dpr}px`;
          await page.render({canvasContext:ctx,viewport:scaled}).promise;
          current=number;
          flash(`${current} / ${pdf.numPages}`);
        } catch(e) { flash('表示エラー'); console.error(e); }
        finally { rendering=false; if(pending !== null) {const next=pending; pending=null; if(next!==current) render(next);} }
      }
      input.addEventListener('change', async () => {
        const file=input.files?.[0]; if(!file) return;
        error.textContent='';
        if(!window.pdfjsLib) { error.textContent='PDF表示ライブラリを読み込めません。ネット接続を確認して再読み込みしてください。'; return; }
        try {
          pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          const data = await file.arrayBuffer();
          const loaded = await pdfjsLib.getDocument({
            data,
            cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
            cMapPacked: true,
            standardFontDataUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',
            useSystemFonts: true,
            disableFontFace: true
          }).promise;
          pdf=loaded; current=1; pending=null; start.style.display='none';
          await render(1);
        } catch(e) { start.style.display='flex'; error.textContent='PDFを開けませんでした。別のPDFで試してください。'; console.error(e); }
        input.value='';
      });
      const viewer = document.getElementById('viewer');
      viewer.addEventListener('pointerdown', () => {holdFired=false; holdTimer=setTimeout(()=>{holdFired=true; start.style.display='flex';},850);});
      ['pointerup','pointercancel','pointerleave'].forEach(ev=>viewer.addEventListener(ev,()=>clearTimeout(holdTimer)));
      viewer.addEventListener('click', e => { if(!pdf || holdFired || start.style.display!=='none') return; render(current+(e.clientX<innerWidth/2?-1:1)); });
      document.addEventListener('keydown',e=>{if(!pdf || start.style.display!=='none')return; if(e.key==='ArrowRight'||e.key===' ')render(current+1); if(e.key==='ArrowLeft')render(current-1); if(e.key==='Escape')start.style.display='flex';});
      let resizeTimer; addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(pdf&&start.style.display==='none')render(current);},180);});
      if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(console.warn);
    })();
  </script>
</body>
</html>
