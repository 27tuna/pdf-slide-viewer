<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Font Diagnostics v0.4</title><style>body{font-family:system-ui,sans-serif;background:#17191d;color:#eee;padding:16px;margin:0}h1{font-size:21px}button,input{font-size:16px;padding:10px;margin:6px 4px 6px 0}button{border-radius:8px;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#272b33;padding:12px;border-radius:8px;font-size:12px;max-height:50vh;overflow:auto}canvas{max-width:100%;height:auto;background:#fff}small{color:#bbb}</style></head><body><h1>PDF Font Diagnostics v0.4</h1><p><small>PDF.js 3.11.174 / 診断対象は最初のページ。個人情報を含むPDFのログ共有には注意してください。</small></p><input id="file" type="file" accept=".pdf,application/pdf"><button id="copy">ログをコピー</button><pre id="log">PDFを選択してください。</pre><canvas id="page"></canvas><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(()=>{const logEl=document.getElementById('log');let lines=[];function log(...a){const line=a.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' ');lines.push(line);logEl.textContent=lines.join('\n');}const originalWarn=console.warn.bind(console),originalError=console.error.bind(console);console.warn=(...a)=>{log('WARN',...a.map(String));originalWarn(...a)};console.error=(...a)=>{log('ERROR',...a.map(String));originalError(...a)};window.addEventListener('error',e=>log('WINDOW ERROR',e.message));window.addEventListener('unhandledrejection',e=>log('REJECTION',String(e.reason)));document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));alert('コピーしました')}catch(e){log('コピー失敗',String(e))}};
document.getElementById('file').onchange=async e=>{lines=[];log('診断開始');const file=e.target.files[0];if(!file)return;log('ファイル',file.name,'サイズ',file.size);if(!window.pdfjsLib){log('PDF.jsを読み込めません。ネット接続を確認してください');return;}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfjsLib.verbosity=pdfjsLib.VerbosityLevel.INFOS;let task;try{task=pdfjsLib.getDocument({data:await file.arrayBuffer(),verbosity:pdfjsLib.VerbosityLevel.INFOS,cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',disableFontFace:false,useSystemFonts:false});const pdf=await task.promise;log('ページ数',pdf.numPages);const p=await pdf.getPage(1);const content=await p.getTextContent();log('文字抽出',JSON.stringify({items:content.items.length,styles:Object.keys(content.styles),sample:content.items.slice(0,3).map(i=>i.str)}));const op=await p.getOperatorList();const names=Object.fromEntries(Object.entries(pdfjsLib.OPS).map(([k,v])=>[v,k]));const counts={};for(const f of op.fnArray){const n=names[f]||String(f);counts[n]=(counts[n]||0)+1;}log('描画命令集計',counts);for(let i=0;i<op.fnArray.length;i++){const name=names[op.fnArray[i]]||String(op.fnArray[i]);if(/font|text|glyph|char/i.test(name)){const args=op.argsArray[i];let summary;try{summary=JSON.stringify(args,(key,value)=>{if(key==='data'&&value?.length>200)return '[data omitted]';if(typeof value==='string'&&value.length>160)return value.slice(0,160)+'…';return value});if(summary.length>1500)summary=summary.slice(0,1500)+'…';}catch(e){summary=String(args)}log('OP',i,name,summary);}}const vp=p.getViewport({scale:Math.min(1.3,800/p.view[2])});const canvas=document.getElementById('page');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await p.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;log('Canvas描画 完了');}catch(err){log('診断エラー',String(err),err?.stack||'')}finally{log('診断終了')}}})();
</script></body></html>
