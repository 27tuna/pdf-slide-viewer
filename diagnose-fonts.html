<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PDF Slide Viewer - フォント診断</title><style>body{margin:0;background:#151515;color:#eee;font:15px system-ui,sans-serif;padding:16px}button,input,select{font:inherit;margin:6px 4px 6px 0}button{padding:9px 14px}canvas{display:block;max-width:100%;height:auto;background:#fff;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#262626;padding:12px;border-radius:8px;font-size:12px}#info{color:#9ed}label{display:inline-block;margin-right:12px}</style></head><body><h2>PDF Slide Viewer：文字診断 v0.3</h2><p>元のIllustrator製PDFを選択してください。診断結果はこの端末内で処理され、送信されません。</p><input id="file" type="file" accept=".pdf,application/pdf"><div><label><input type="checkbox" id="disable">disableFontFace を有効</label><button id="rerender">設定を変えて再読み込み</button></div><div><button id="prev">◀ 前</button><span id="info">未選択</span><button id="next">次 ▶</button><button id="copy">診断ログをコピー</button></div><canvas id="page"></canvas><h3>診断ログ</h3><pre id="log">PDFを選択すると診断を開始します。</pre><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(()=>{const $=id=>document.getElementById(id),canvas=$('page'),ctx=canvas.getContext('2d'),log=$('log');let file,pdf,current=1,lines=[],run=0;const add=(...xs)=>{lines.push(xs.map(x=>typeof x==='string'?x:JSON.stringify(x)).join(' '));log.textContent=lines.join('\n');};const oldWarn=console.warn,oldError=console.error;console.warn=(...a)=>{add('[WARN]',...a.map(String));oldWarn.apply(console,a)};console.error=(...a)=>{add('[ERROR]',...a.map(String));oldError.apply(console,a)};window.addEventListener('error',e=>add('[window error]',e.message));window.addEventListener('unhandledrejection',e=>add('[rejection]',String(e.reason)));async function load(){if(!file)return;const id=++run;lines=[];add('ファイル:',file.name,'サイズ:',file.size,'bytes');add('PDF.js:',pdfjsLib.version,'disableFontFace:',String($('disable').checked));try{if(pdf){await pdf.destroy();pdf=null}pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer(),cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/',disableFontFace:$('disable').checked,useSystemFonts:false,verbosity:pdfjsLib.VerbosityLevel.WARNINGS}).promise;if(id!==run)return;add('ページ数:',pdf.numPages);current=1;await render()}catch(e){add('読み込み失敗:',String(e),e?.stack||'')}}async function render(){if(!pdf)return;const id=run;try{const page=await pdf.getPage(current);const content=await page.getTextContent();add('--- ページ',current,'---');add('文字要素数:',content.items.length,'文字数:',content.items.reduce((n,i)=>n+(i.str?.length||0),0));add('文字サンプル:',content.items.slice(0,8).map(i=>({text:i.str,fontName:i.fontName})));add('フォント定義:',Object.entries(content.styles).slice(0,15).map(([k,v])=>({id:k,fontFamily:v.fontFamily,vertical:v.vertical})));const op=await page.getOperatorList();const counts={};for(const fn of op.fnArray){const name=Object.entries(pdfjsLib.OPS).find(([k,v])=>v===fn)?.[0]||String(fn);if(/text|font|glyph/i.test(name))counts[name]=(counts[name]||0)+1;}add('文字描画命令:',counts);const base=page.getViewport({scale:1});const scale=Math.min(2,Math.max(.2,(innerWidth-32)/base.width));const vp=page.getViewport({scale});canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);await page.render({canvasContext:ctx,viewport:vp}).promise;if(id!==run)return;$('info').textContent=`${current} / ${pdf.numPages}`;add('Canvas描画: 完了');}catch(e){add('描画失敗:',String(e),e?.stack||'')}}$('file').onchange=e=>{file=e.target.files?.[0];load()};$('rerender').onclick=load;$('prev').onclick=()=>{if(pdf&&current>1){current--;render()}};$('next').onclick=()=>{if(pdf&&current<pdf.numPages){current++;render()}};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(lines.join('\n'));$('copy').textContent='コピーしました'}catch(e){add('コピーできません:',String(e))}};if(!window.pdfjsLib)log.textContent='PDF.jsの読み込みに失敗しました。ネット接続を確認してください。';})();
</script></body></html>
