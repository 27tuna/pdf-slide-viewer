<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PDF Slide Viewer — PDFium WASM v0.8</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}#viewer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:manipulation}canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}#panel{position:fixed;inset:0;z-index:2;background:#161616;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:22px;text-align:center}#panel p{font-size:14px;color:#bbb;max-width:440px;line-height:1.6}button{font:inherit;padding:12px 20px;border-radius:12px;border:0;background:white;color:black;font-weight:650}#file{display:none}#message{color:#ffd0d0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;max-width:90vw}#status{position:fixed;z-index:3;bottom:calc(16px + env(safe-area-inset-bottom));right:calc(12px + env(safe-area-inset-right));background:#222d;border-radius:9px;padding:7px 12px;font-size:13px;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s}#status.visible{pointer-events:auto;cursor:pointer;user-select:none}#back{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));right:calc(12px + env(safe-area-inset-right));z-index:3;font-size:12px;padding:8px 12px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .4s ease,visibility .4s}#status.visible,#back.visible{opacity:1;visibility:visible}#back.visible{pointer-events:auto}@media(prefers-reduced-motion:reduce){#status,#back{transition:none}}</style></head><body>
<div id="viewer"><canvas id="page"></canvas></div><div id="panel"><h2>PDFium WASM テスト</h2><p>左タップ：前のページ／右タップ：次のページ。<br>右下のページ番号をタップすると、別のPDFを選べます。<br>初回はWASMの読み込みに時間がかかります。ネット接続が必要です。</p><button id="choose">PDFを選択</button><input id="file" type="file" accept=".pdf,application/pdf"><div id="message" role="status"></div></div><button id="back">別のPDFを選ぶ</button><div id="status" role="button" tabindex="-1" aria-label="ページ番号。タップでファイル選択ボタンを表示" title="タップでファイル選択ボタンを表示"></div>
<script type="module">
const $=id=>document.getElementById(id);const panel=$('panel'),file=$('file'),canvas=$('page'),message=$('message'),status=$('status');
let mod=null,doc=0,filePtr=0,total=0,current=0,busy=false,queued=null,uiTimer=null,backTimer=null,loaded=false;
function showControls(){if(!loaded)return;status.classList.add('visible');clearTimeout(uiTimer);uiTimer=setTimeout(()=>status.classList.remove('visible'),3000)}
function showBack(){if(!loaded)return;$('back').classList.add('visible');clearTimeout(backTimer);backTimer=setTimeout(()=>$('back').classList.remove('visible'),3000)}
function hideControls(){clearTimeout(uiTimer);clearTimeout(backTimer);status.classList.remove('visible');$('back').classList.remove('visible')}
function flash(s){status.textContent=s;showControls()}
function cleanup(){hideControls();if(mod&&doc){mod.FPDF_CloseDocument(doc);doc=0}if(mod&&filePtr){mod.pdfium.wasmExports.free(filePtr);filePtr=0}total=0;current=0;loaded=false}
function error(e){console.error(e);message.textContent='エラー: '+(e?.message||String(e))+'\nこの内容をチャットに送ってね。';panel.style.display='flex';hideControls()}
async function init(){if(mod)return mod;message.textContent='PDFiumをダウンロード・初期化しています…';const {init}=await import('https://esm.sh/@embedpdf/pdfium@2.15.1?bundle');const url='https://cdn.jsdelivr.net/npm/@embedpdf/pdfium@2.15.1/dist/pdfium.wasm';const r=await fetch(url);if(!r.ok)throw new Error('WASM取得失敗 HTTP '+r.status);mod=await init({wasmBinary:await r.arrayBuffer()});mod.PDFiumExt_Init();return mod}
function renderOne(n){if(!doc)return;const p=mod.FPDF_LoadPage(doc,n);if(!p)throw new Error('ページ読み込み失敗: '+(n+1));let bmp=0;try{const w=mod.FPDF_GetPageWidthF(p),h=mod.FPDF_GetPageHeightF(p);if(!(w>0&&h>0))throw new Error('ページサイズ不正');const fit=Math.min(innerWidth/w,innerHeight/h);const dpr=Math.min(devicePixelRatio||1,2);let rw=Math.max(1,Math.floor(w*fit*dpr)),rh=Math.max(1,Math.floor(h*fit*dpr));const maxPixels=4000000;if(rw*rh>maxPixels){const k=Math.sqrt(maxPixels/(rw*rh));rw=Math.max(1,Math.floor(rw*k));rh=Math.max(1,Math.floor(rh*k))}bmp=mod.FPDFBitmap_Create(rw,rh,0);if(!bmp)throw new Error('ビットマップ作成失敗');mod.FPDFBitmap_FillRect(bmp,0,0,rw,rh,0xFFFFFFFF);mod.FPDF_RenderPageBitmap(bmp,p,0,0,rw,rh,0,16);const ptr=mod.FPDFBitmap_GetBuffer(bmp);if(!ptr)throw new Error('描画バッファ取得失敗');const data=new Uint8ClampedArray(mod.pdfium.HEAPU8.buffer,mod.pdfium.HEAPU8.byteOffset+ptr,rw*rh*4).slice();canvas.width=rw;canvas.height=rh;canvas.style.width=(rw/dpr)+'px';canvas.style.height=(rh/dpr)+'px';canvas.getContext('2d').putImageData(new ImageData(data,rw,rh),0,0);current=n;flash((n+1)+' / '+total)}finally{if(bmp)mod.FPDFBitmap_Destroy(bmp);mod.FPDF_ClosePage(p)}}
function go(n){if(!doc)return;n=Math.max(0,Math.min(total-1,n));if(busy){queued=n;return}busy=true;try{renderOne(n)}catch(e){error(e)}finally{busy=false;if(queued!==null){const q=queued;queued=null;if(q!==current)go(q)}}}
$('choose').onclick=()=>file.click();status.addEventListener('click',e=>{e.stopPropagation();if(status.classList.contains('visible'))showBack()});$('back').onclick=e=>{e.stopPropagation();clearTimeout(uiTimer);hideControls();panel.style.display='flex';message.textContent='';file.click()};file.onchange=async()=>{const f=file.files?.[0];file.value='';if(!f)return;try{await init();cleanup();message.textContent='PDFを読み込んでいます…';const bytes=new Uint8Array(await f.arrayBuffer());filePtr=mod.pdfium.wasmExports.malloc(bytes.length);if(!filePtr)throw new Error('PDFメモリ確保失敗');mod.pdfium.HEAPU8.set(bytes,filePtr);doc=mod.FPDF_LoadMemDocument(filePtr,bytes.length,0);if(!doc)throw new Error('PDFを開けません (PDFium code '+mod.FPDF_GetLastError()+')');total=mod.FPDF_GetPageCount(doc);if(!total)throw new Error('ページ数0');panel.style.display='none';loaded=true;go(0)}catch(e){cleanup();error(e)}};
$('viewer').onclick=e=>{if(!loaded||panel.style.display!=='none')return;go(current+(e.clientX<innerWidth/2?-1:1))};document.onkeydown=e=>{if(!loaded||panel.style.display!=='none')return;if(e.key==='ArrowLeft')go(current-1);if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(current+1)}if(e.key==='Escape'){clearTimeout(uiTimer);hideControls();panel.style.display='flex'}};window.addEventListener('resize',()=>{if(loaded&&panel.style.display==='none')go(current)});window.addEventListener('pagehide',cleanup);
</script></body></html>
