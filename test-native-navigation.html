<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Native PDF Navigation Test</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#161616;color:white}header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;background:#242424}button,input{font:inherit}button{padding:9px 14px;border:0;border-radius:8px;background:#eee;color:#111}input[type=number]{width:70px;padding:8px}#viewer{width:100%;height:calc(100dvh - 112px);border:0;background:white}#status{padding:8px 10px;font-size:12px;color:#ccc}label{cursor:pointer}</style></head><body><header><label>PDFを選択 <input id="file" type="file" accept="application/pdf,.pdf"></label><button id="prev">前へ</button><input id="page" type="number" min="1" value="1" aria-label="ページ番号"><button id="next">次へ</button><button id="jump">指定ページへ</button></header><div id="status">元のIllustrator製PDFを読み込んでください。ページ移動はブラウザ依存の実験機能です。</div><iframe id="viewer" title="PDFプレビュー"></iframe><script>(()=>{let url=null;let page=1;const file=document.getElementById('file'),frame=document.getElementById('viewer'),number=document.getElementById('page'),status=document.getElementById('status');function show(){if(!url)return;page=Math.max(1,Number(page)||1);number.value=page;frame.src=url+'#page='+page+'&view=Fit';status.textContent='要求したページ: '+page+'（実際に移動したかは画面で確認してください）';}file.addEventListener('change',()=>{const f=file.files&&file.files[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);page=1;show();});document.getElementById('prev').onclick=()=>{page=Math.max(1,page-1);show()};document.getElementById('next').onclick=()=>{page++;show()};document.getElementById('jump').onclick=()=>{page=Number(number.value)||1;show()};addEventListener('beforeunload',()=>{if(url)URL.revokeObjectURL(url)});})();</script></body></html>
